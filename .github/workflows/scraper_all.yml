name: scraper-all

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  scraper-all:
    runs-on: ubuntu-latest

    steps:
    - name: Clone private repo
      env:
        PAT: ${{ secrets.PAT }}
      run: |
        git clone https://x-access-token:${PAT}@github.com/SakamichiSeries/blog-archive-scraper.git

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        cd blog-archive-scraper
        pip install -r requirements.txt

    - name: Run Python script
      run: |
        cd blog-archive-scraper
        date
        python scraper_dispatcher_all.py || date
        date
      env:
        TOKEN_GITHUB: ${{ secrets.PAT }}
        RUNNING_GITHUB_ACTIONS: True
